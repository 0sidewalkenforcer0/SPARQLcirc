name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    name: Python core (${{ matrix.python-version }}, stdlib only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reference correctness battery
        run: python reference/tests.py
      - name: Standalone WMC self-test
        run: python reference/wmc.py
      - name: Algebraic-to-Boolean serialization boundary
        run: python reference/verify_boolean_boundary.py
      - name: User-facing PQE CLI regression
        run: python reference/verify_pqe_cli.py
      - name: Multi-root compiler contract (oracle; CUDD when available)
        run: python reference/verify_compiler.py
      - name: R9 hard-deadline and term-aware parity regressions
        run: python reference/paper/test_r9_construction_harness.py
      - name: Canonical external circuit-cache regressions
        run: python reference/paper/test_circuit_cache.py
      - name: Frozen batch identity and shared validator regressions
        run: python reference/paper/test_freeze_inputs.py
      - name: Controlled-mechanism provenance and recovery regressions
        run: python reference/paper/test_controlled_mechanisms.py
      - name: Certified CNF-primal treewidth evidence regressions
        run: python reference/paper/test_treewidth_evidence.py
      - name: Exploratory d4 pipeline contract (local fake compiler, non-NFS tempdir)
        run: python reference/verify_level1_harness.py

  cudd-production:
    name: CUDD production backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native CUDD wrapper
        run: python -m pip install -r reference/requirements-production.txt
      - name: Shared/per-root and complemented-edge parity
        run: python reference/verify_compiler.py --require-cudd
      - name: Production PQE JSON CLI
        run: python reference/verify_pqe_cli.py --production
      - name: Seeded exact-enumeration differential gate
        run: python reference/verify_differential.py --skip-engine --require-cudd
      - name: Multi-root physical-granularity harness regressions
        run: python reference/paper/test_compiler_granularity.py
      - name: Controlled mechanisms with production CUDD
        run: python reference/paper/test_controlled_mechanisms.py

  fresh-engine-circuit:
    name: Maven build and fresh circuit to WMC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: engine/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the rdflib oracle (quick_verify runs the composition differential)
        run: python -m pip install "rdflib>=6.3,<8"
      - name: Build the shaded engine JAR
        run: mvn -q -f engine/pom.xml package
      - name: Generate, parse, compile, and WMC a fresh circuit
        run: python reference/quick_verify.py
      - name: Factored/flat pure-BGP differential gate
        run: python reference/verify_differential.py --engine-only --require-engine
